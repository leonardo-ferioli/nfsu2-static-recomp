<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" width="1120" height="300" role="img" aria-label="NUE - NFS Underground 2">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#141a33"/>
      <stop offset="1" stop-color="#1d1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="300" rx="18" fill="url(#bg)"/>
  <rect y="190" width="1120" height="110" rx="18" fill="url(#glow)"/>
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="2">
    <line x1="0" y1="262" x2="1120" y2="262"/>
    <line x1="0" y1="280" x2="1120" y2="280"/>
  </g>
  <g transform="skewX(-12)">
    <text x="330" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="14" fill="#ffffff">NUE</text>
    <rect x="334" y="206" width="430" height="8" rx="4" fill="url(#accent)"/>
  </g>
  <text x="560" y="250" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="7" fill="#c9cfe6">NFS UNDERGROUND 2  ·  NATIVE PORT</text>
</svg>
